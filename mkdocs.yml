site_name: wheels_builder
theme:
  name: material
  features:
    - search.suggest
    - search.highlight
    - search.share

    - header.autohide
    - navigation.footer

    # code
    - content.code.copy
    - content.code.select

  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

nav:
  - Overview: index.md
  - Building Wheels:
      - build_wheel.sh: build_wheels.md
      - parbuild_wheel.sh: parbuild_wheel.md
      - Configuration Recipes: config.md
  - Binary (manylinux) Wheels:
      - unmanylinuxize.sh: unmanylinuxize.md
  - Inspection & Deployment:
      - wheel_architecture.sh: wheel_architecture.md
      - cp_wheels.sh: cp_wheels.md
      - manipulate_wheels.py: manipulate_wheels.md

markdown_extensions:
  - def_list
  - abbr
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
